 --ink:#11151F;
 --ink-2:#1B2130;
 --paper:#F6F3EA;
 --card:#FFFFFF;
 --brass:#A9832F;
 --brass-light:#D8BD79;
 --brass-soft:#F1E7CC;
 --forest:#1E4B3E;
 --forest-soft:#E4EDE8;
 --text:#14171F;
 --text-mute:#71767E;
 --border:#E6E0D1;
 --danger:#AE3E37;
 --danger-soft:#F6E8E6;
 --warning:#93691E;
 --warning-soft:#F3E9D2;
 --ok-soft:#E4EDE8;
 --radius-lg:20px;
 --radius-md:14px;
 --radius-pill:999px;
 --shadow:0 14px 30px rgba(17,21,31,0.10);
 --shadow-sm:0 3px 10px rgba(17,21,31,0.06);
 /* legacy aliases — old variable names used in inline styles throughout
 the JS renderers, mapped onto the new palette so nothing silently
 falls back to browser defaults. */
 --primary:var(--forest);
 --primary-dark:var(--ink);
 --accent:var(--brass);
 --accent-soft:var(--brass-soft);
 --dark-card-1:var(--ink);
 --dark-card-2:var(--ink-2);
 --bg:var(--paper);
 }
 *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
 html,body{height:100%;}
 body{
 margin:0; background:#E9E3D2; font-family:'Inter',sans-serif; color:var(--text);
 display:flex; justify-content:center;
 }
 h1,h2,h3,.display{font-family:'Fraunces',serif; font-weight:600; letter-spacing:-.01em;}
 #phone{
 width:100%; max-width:430px; min-height:100vh; background:var(--paper);
 position:relative; overflow-x:hidden; display:flex; flex-direction:column;
 }
 ::-webkit-scrollbar{display:none;}
 button{font-family:inherit; cursor:pointer;}
 input{font-family:inherit;}
 .hidden{display:none !important;}

 /* ---------- Buttons ---------- */
 .btn{
 border:none; border-radius:12px; padding:15px 20px; font-weight:700;
 font-size:14.5px; display:flex; align-items:center; justify-content:center; gap:8px;
 transition:transform .16s cubic-bezier(.34,1.56,.64,1), opacity .15s ease, box-shadow .2s ease, filter .15s ease, background .2s ease;
 position:relative; overflow:hidden; letter-spacing:.1px;
 }
 .btn:active{transform:scale(0.96);}
 .btn-primary{background:var(--ink); color:#F3ECD6; box-shadow:0 8px 16px rgba(17,21,31,.22); border-top:2px solid var(--brass);}
 .btn-primary::before{content:none;}
 .btn-primary:hover{background:#1B2130; box-shadow:0 10px 20px rgba(17,21,31,.28); transform:translateY(-1px);}
 .btn-primary:active{box-shadow:0 4px 10px rgba(17,21,31,.3); transform:scale(0.96) translateY(0);}
 .btn-outline{background:#fff; color:var(--ink); border:1.5px solid var(--ink); transition:all .18s ease;}
 .btn-outline:hover{background:var(--ink); color:#F3ECD6;}
 .btn-ghost{background:transparent; color:var(--text-mute); border:1.5px solid var(--border);}
 .btn-ghost:hover{border-color:var(--brass); color:var(--ink);}
 .btn-danger{background:var(--danger); color:#fff;}
 .btn-block{width:100%;}
 .btn-sm{padding:9px 16px; font-size:12.5px; border-radius:10px;}
 .btn:disabled{opacity:.55; pointer-events:none;}
 .btn-spin{
 width:18px; height:18px; border-radius:50%;
 border:2.5px solid rgba(243,236,214,.35); border-top-color:#F3ECD6;
 animation:btnspin .7s linear infinite; flex-shrink:0;
 }
 .btn-outline .btn-spin, .btn-ghost .btn-spin{
 border:2.5px solid rgba(17,21,31,.15); border-top-color:var(--ink);
 }
 @keyframes btnspin{to{transform:rotate(360deg);}}
 @keyframes spin{to{transform:rotate(360deg);}}
 .spinner{border:3px solid var(--brass-soft); border-top-color:var(--brass); border-radius:50%; animation:spin .7s linear infinite;}

 /* ---------- Auth ---------- */
 #auth-screen{flex:1; display:flex; flex-direction:column; padding:34px 24px 24px; background:var(--ink); color:#EFE9D8;}
 .auth-logo{display:flex; align-items:center; gap:11px; margin-bottom:40px;}
 .auth-logo .mark{width:52px; height:52px; background:var(--logo-url) center/contain no-repeat; filter:drop-shadow(0 4px 10px rgba(169,131,47,.4));}
 .auth-logo .name{font-weight:600; font-size:20px; font-family:'Fraunces',serif; color:#F3ECD6;}
 .auth-title{font-size:28px; font-weight:600; margin:0 0 6px; font-family:'Fraunces',serif; color:#F3ECD6;}
 .auth-sub{color:#A79E85; font-size:14px; margin:0 0 30px;}
 .field{margin-bottom:14px;}
 .field label{display:block; font-size:12px; font-weight:700; color:#A79E85; margin-bottom:7px; letter-spacing:.15px;}
 .field-input{
 display:flex; align-items:center; gap:10px; background:rgba(255,255,255,.05); border:1.5px solid rgba(255,255,255,.14);
 border-radius:12px; padding:13px 15px;
 }
 .field-input:focus-within{border-color:var(--brass);}
 .field-input input{border:none; outline:none; flex:1; font-size:15px; background:transparent; color:#F3ECD6;}
 .field-input input::placeholder{color:#6E6A5B;}
 .field-input svg{flex-shrink:0; color:#A79E85;}

 /* ---- boot splash ---- */

 position:fixed; inset:0; z-index:9999; background:var(--ink);
 display:flex; flex-direction:column; align-items:center; justify-content:center;

 }

 }

 }

 }
 @keyframes splashPulse{
 0%,100%{transform:scale(1); box-shadow:0 0 60px 8px rgba(169,131,47,.4), 0 0 120px 30px rgba(169,131,47,.15);}
 50%{transform:scale(1.04); box-shadow:0 0 78px 14px rgba(169,131,47,.5), 0 0 140px 40px rgba(169,131,47,.2);}
 }

 }

 }

 .profile-head b{font-size:17px; font-family:'Fraunces',serif; font-weight:600;}
 .profile-head span{font-size:12.5px; color:var(--text-mute);}
 .menu-row{display:flex; align-items:center; gap:12px; background:#fff; border:1px solid var(--border); border-radius:14px; padding:13px; margin-bottom:10px; transition:transform .12s ease, box-shadow .15s ease, border-color .15s ease; cursor:pointer;}
 .menu-row:active{transform:scale(0.98); box-shadow:0 3px 8px rgba(0,0,0,.06);}

 @keyframes sk{0%{background-position:100% 50%} 100%{background-position:0 50%}}

 /* ---------- (legacy — kept for any lingering references) ---------- */
 .activation-card{

 padding:18px; margin-bottom:14px;
 }
 .activation-card-top{display:flex; align-items:center; gap:12px; margin-bottom:14px;}

 .svc-item{position:relative;}
 .lock-badge{position:absolute; top:6px; right:6px; width:18px; height:18px; border-radius:50%; background:#fff; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; color:var(--text-mute); box-shadow:var(--shadow-sm);}

 .plan-list{display:flex; flex-direction:column; gap:10px;}

 .plan-item input{accent-color:var(--ink); width:18px; height:18px; flex-shrink:0;}

 .plan-body b{display:block; font-size:13.5px;}
 .plan-body span{font-size:11.5px; color:var(--text-mute);}
 .plan-note{font-size:11px; color:var(--text-mute); text-align:center; margin-top:10px; line-height:1.5;}

 .activation-box{

 text-align:center; width:100%; max-width:320px; box-shadow:var(--shadow); animation:actPop .35s ease;
 }
 @keyframes actPop{from{transform:scale(.85); opacity:0} to{transform:scale(1); opacity:1}}
 .spinner-ring{

 border-top-color:var(--brass); animation:actSpin .9s linear infinite; margin-bottom:20px;
 }
 @keyframes actSpin{to{transform:rotate(360deg)}}
 .check-mark{width:60px; height:60px; margin-bottom:20px;}
 .check-circle{stroke:var(--forest); stroke-width:2; fill:none; stroke-dasharray:166; stroke-dashoffset:166;}

 @media (prefers-reduced-motion: reduce){

 user: {

 packages:[],

 sellServices:{},
 mySellSubmissions:[]
};

// Subscription plans that unlock the account (Task / Refer / Wallet / Withdraw / Salary).
// NOTE: this is a UI-only demo flow. Wire the real charge to a licensed gateway
// (bKash/Nagad Merchant API, SSLCommerz, etc.) on the backend before going live —
// never collect payment confirmation client-side only.
const PLANS = [
 {id:'monthly', name:'Monthly Plan', price:299, period:'months'},
 {id:'yearly', name:'Yearly Plan', price:2499, period:'years', note:'Affordable'},
];

// Features that require an active subscription to use.
/* Account activation removed — all views are unlocked by default now. */

let currentView = 'home';
let selectedPlan = 'monthly';
let selectedDepositMethod = 'bKash';

/* ============================================================
 FIREBASE DATA LAYER
 - Firebase Auth stores the password securely.
 - Firestore stores the user's profile, balances, referral data,
 activation status and transaction history.
 - New accounts start with every balance at 0.
 ============================================================ */

const DEFAULT_SETTINGS = {
 referralCommission: 15,
 dailyFreeIncome: 30,
 minDeposit: 50,
 maxDeposit: 50000,
 bkashDepositNumber: '01403594918',
 nagadDepositNumber: '01403593914',
 minWithdraw: 100,
 maxWithdraw: 20000,
 withdrawFeePercent: 2,
 salaryTarget: 50,
 salaryMonthly: 3000,
 supportLink: '',
 withdrawPolicy: 'all'
};

let firebaseSettings = {...DEFAULT_SETTINGS};
let firebaseUnsubUser = null;

function normalizePhone(phone){
 return phone.replace(/\s|-/g,'');
}

function phoneAuthEmail(phone){
 // The phone number is used only as the user's login identifier.
 // The actual password is handled by Firebase Authentication.
 return `${normalizePhone(phone)}@login.aventora.local`;
}

function makeReferralCode(){
 const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
 let code = 'PB-';
 for(let i=0;i<6;i++) code += chars[Math.floor(Math.random()*chars.length)];
 return code;
}

function getReferralFromUrl(){
 try{
 const p = new URLSearchParams(location.search);
 return (p.get('ref') || '').trim().toUpperCase();
 }catch(e){ return ''; }
}

async function loadFirebaseSettings(){
 const fb = window.aventoraFirebase;
 if(!fb) return;
 try{
 const snap = await fb.getDoc(fb.doc(fb.db,'settings','config'));
 if(snap.exists()){
 firebaseSettings = {...DEFAULT_SETTINGS, ...(snap.data() || {})};
 }
 }catch(e){
 console.warn('Settings read failed; using defaults.', e);
 firebaseSettings = {...DEFAULT_SETTINGS};
 }
}

function applyFirebaseUserData(data){
 const d = data || {};
 state.user = {
 ...state.user,
 ...d,
 name: d.name || state.user.name || 'User',
 phone: d.phone || state.user.phone || '',
 userId: d.userId || state.user.userId || d.uid || '',
 referralId: d.referralId || state.user.referralId || '',
 status: d.status || 'inactive',
 avatarInitial: (d.name || state.user.name || 'U')[0],
 totalRevenue: Number(d.totalRevenue || 0),
 mainBalance: Number(d.mainBalance || 0),
 salaryBalance: Number(d.salaryBalance || 0),
 referralBalance: Number(d.referralBalance || 0),
 depositBalance: Number(d.depositBalance || 0),
 referralCount: Number(d.referralCount || 0),
 completedTaskIds: Array.isArray(d.completedTaskIds) ? d.completedTaskIds : [],
 bkashNumber: d.bkashNumber || null,
 bkashVerified: !!d.bkashVerified,
 nagadNumber: d.nagadNumber || null,
 nagadVerified: !!d.nagadVerified,
 hasPurchasedPackage: !!d.hasPurchasedPackage,
 currency: 'BDT'
 };
}

function timeAgo(date){
 const s = Math.floor((Date.now() - date.getTime())/1000);
 if(s < 60) return 'Just now';
 const m = Math.floor(s/60);
 if(m < 60) return `${m} minutes ago`;
 const h = Math.floor(m/60);
 if(h < 24) return `${h} hours ago`;
 const dday = Math.floor(h/24);
 if(dday === 1) return 'Yesterday';
 if(dday < 7) return `${dday} days ago`;
 return date.toLocaleDateString('bn-BD');
}

function updateNotifBadge(){
 const badge = document.getElementById('notif-badge');
 if(!badge) return;
 const unread = (state.notifications||[]).some(n=>!n.read);
 badge.classList.toggle('hidden', !unread);
}

async function loadCurrentUser(){
 const fb = window.aventoraFirebase;
 if(!fb || !fb.auth.currentUser) return false;

 await loadFirebaseSettings();
 const uid = fb.auth.currentUser.uid;
 const snap = await fb.getDoc(fb.doc(fb.db,'users',uid));
 if(!snap.exists()){
 toast('Account data not found');
 return false;
 }
 const userData = snap.data();
 if(userData.banned){
 try{ await fb.signOut(fb.auth); }catch(e){}
 toast('Your account has been banned. Contact support for more details.');
 return false;
 }

 applyFirebaseUserData(userData);
 await grantDailyFreeIncome();
 await grantInvestmentIncome();
 await loadUserCollections();
 return true;
}

// Re-fetches everything (settings, balances, history) and re-renders the
// current screen WITHOUT reloading the browser page — so the session and
// scroll position are never disturbed and there's no risk of a logout.
async function softRefresh(btn){
 const spin = btn?.querySelector('svg');
 if(spin) spin.style.animation = 'spin .6s linear infinite';
 try{
 const ctx = await ensureReady();
 if(!ctx){ toast('Check your internet connection and try again'); return; }
 const ok = await loadCurrentUser();
 if(ok){
 go(currentView || 'home');
 toast('Refreshed');
 }
 }catch(e){
 console.error(e);
 toast('Could not refresh');
 } finally {
 if(spin) spin.style.animation = '';
 }
}

function openSupport(){
 const link = (firebaseSettings.supportLink || '').trim();
 if(!link){ toast('Support link has not been set yet'); return; }
 window.open(link, '_blank');
}

async function loadUserCollections(){
 const fb = window.aventoraFirebase;
 if(!fb || !fb.auth.currentUser) return;
 const uid = fb.auth.currentUser.uid;

 try{
 const rq = await fb.getDocs(
 fb.query(fb.collection(fb.db,'publicProfiles'), fb.where('referrerUid','==',uid))
 );
 state.referrals = rq.docs.map(s => {
 const d=s.data();
 return {
 name:d.name || 'User',
 id:d.userId || s.id,
 date:d.createdAt?.toDate ? d.createdAt.toDate().toLocaleDateString('bn-BD') : '',
 status:d.status || 'inactive'
 };
 });
 }catch(e){ console.warn('Referral list read failed',e); }

 try{
 const tq = await fb.getDocs(
 fb.query(
 fb.collection(fb.db,'transactions'),
 fb.where('uid','==',uid)
 )
 );
 state.earningsHistory = tq.docs.map(s=>{
 const d=s.data();
 const raw = Number(d.amount||0);
 return {
 t:d.title || 'Income',
 d:d.createdAt?.toDate ? d.createdAt.toLocaleString('bn-BD') : 'Now',
 amt:Math.abs(raw),
 sign: raw < 0 ? -1 : 1
 };
 }).sort((a,b)=>String(b.d).localeCompare(String(a.d))).slice(0,100);
 }catch(e){ console.warn('Transaction read failed',e); }

 // One-time migration: users who added wallets under the old (editable,
 // multi-slot) system get those numbers copied into the new permanent
 // bkash/nagad fields, if those fields are still empty.
 try{
 if(!state.user.bkashNumber || !state.user.nagadNumber){
 const wq = await fb.getDocs(fb.collection(fb.db,'users',uid,'wallets'));
 const oldWallets = wq.docs.map(s=>s.data());
 const patch = {};
 if(!state.user.bkashNumber){
 const old = oldWallets.find(w=>w.type==='bKash');
 if(old){ patch.bkashNumber = old.number; patch.bkashVerified = !!old.verified; }
 }
 if(!state.user.nagadNumber){
 const old = oldWallets.find(w=>w.type==='Nagad');
 if(old){ patch.nagadNumber = old.number; patch.nagadVerified = !!old.verified; }
 }
 if(Object.keys(patch).length){
 await fb.updateDoc(fb.doc(fb.db,'users',uid), patch);
 Object.assign(state.user, patch);
 }
 }
 }catch(e){ console.warn('Wallet migration failed',e); }

 try{
 const nq = await fb.getDocs(
 fb.query(fb.collection(fb.db,'users',uid,'notifications'), fb.orderBy('createdAt','desc'), fb.limit(50))
 );
 state.notifications = nq.docs.map(s=>{
 const d=s.data();
 return {
 id:s.id, title:d.title||'', body:d.body||'', type:d.type||'general',
 read:!!d.read, time: d.createdAt?.toDate ? timeAgo(d.createdAt.toDate()) : 'Now'
 };
 });
 updateNotifBadge();
 }catch(e){ console.warn('Notifications read failed',e); }

 try{
 const wdq = await fb.getDocs(fb.query(fb.collection(fb.db,'withdrawalRequests'), fb.where('uid','==',uid)));
 state.withdrawHistory = wdq.docs.map(s=>{
 const d=s.data();
 return {
 amt:Number(d.amount||0),
 wallet:`${d.walletType||''} •• ${(d.walletNumber||'').slice(-4)}`,
 date:d.createdAt?.toDate ? d.createdAt.toDate().toLocaleDateString('bn-BD') : '',
 status:d.status||'pending'
 };
 }).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 }catch(e){ console.warn('Withdraw history read failed',e); }

 try{
 const rdq = await fb.getDocs(fb.query(fb.collection(fb.db,'redemptions'), fb.where('uid','==',uid)));
 state.redeemHistory = rdq.docs.map(s=>{
 const d=s.data();
 return {code:d.code||'', amt:Number(d.amount||0), date:d.createdAt?.toDate ? d.createdAt.toDate().toLocaleDateString('bn-BD') : ''};
 });
 }catch(e){ console.warn('Redeem history read failed',e); }

 try{
 const sq = await fb.getDocs(fb.query(fb.collection(fb.db,'salaryRequests'), fb.where('uid','==',uid)));
 const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
 state.salaryHistory = sq.docs.map(s=>{
 const d=s.data();
 const [y,m]=(d.month||'').split('-');
 return {
 month: d.month||'',
 monthLabel: m ? `${monthNames[Number(m)-1]} ${y}` : (d.month||''),
 status: d.status||'pending'
 };
 }).sort((a,b)=>String(b.month).localeCompare(String(a.month)));
 }catch(e){ console.warn('Salary history read failed',e); }

 try{
 const pq = await fb.getDocs(fb.query(fb.collection(fb.db,'investmentPackages'), fb.where('active','==',true)));
 state.packages = pq.docs.map(s=>({id:s.id, ...s.data()}))
 .sort((a,b)=>Number(a.price||0)-Number(b.price||0));
 }catch(e){ console.warn('Packages read failed',e); }

 try{
 const sub = await fb.getDocs(fb.query(fb.collection(fb.db,'investmentSubscriptions'), fb.where('uid','==',uid)));
 state.mySubscriptions = sub.docs.map(s=>({id:s.id, ...s.data()}))

// Fires once per referred user — the moment they buy their FIRST investment
// package. Pays a fixed, admin-configurable commission (settings/config ->
// referralCommission) to their direct referrer. Uses atomic increment()
// instead of reading the referrer's document first, since a normal user's
// Firestore rules typically only grant WRITE access to specific balance
// fields on another user's doc, not READ access to the whole document —
// reading it first would throw permission-denied and roll back everything.
async function processPackageReferralCommission(){
 const fb = window.aventoraFirebase;
 if(!fb || !fb.auth.currentUser) return;

 const uid = fb.auth.currentUser.uid;
 const userRef = fb.doc(fb.db,'users',uid);

 try{
 let rewarded = false;
 let referrerUid = null;
 const commission = Number(firebaseSettings.referralCommission || 15);

 await fb.runTransaction(fb.db, async tx=>{
 const userSnap = await tx.get(userRef);
 if(!userSnap.exists()) return;

 const u=userSnap.data();
 if(!u.referrerUid || u.referralRewarded === true) return;

 const refRef = fb.doc(fb.db,'users',u.referrerUid);
 tx.update(refRef,{
 referralBalance: fb.increment(commission),
 mainBalance: fb.increment(commission),
 totalRevenue: fb.increment(commission),
 referralCount: fb.increment(1),
 updatedAt:fb.serverTimestamp()
 });
 tx.update(userRef,{referralRewarded:true, updatedAt:fb.serverTimestamp()});

 const pubRef = fb.doc(fb.db,'publicProfiles',u.referrerUid);
 tx.set(pubRef,{referralCount: fb.increment(1)}, {merge:true});

 const notifRef = fb.doc(fb.collection(fb.db,'users',u.referrerUid,'notifications'));
 tx.set(notifRef,{
 title:'New Referral Commission',
 body:`You have received a ৳${commission} referral commission`,
 type:'referral', read:false, createdAt:fb.serverTimestamp()
 });
 rewarded=true;
 referrerUid=u.referrerUid;
 });

 if(rewarded){
 await fb.addDoc(fb.collection(fb.db,'transactions'),{
 uid:referrerUid,
 type:'referral',
 title:'Referral Commission',
 amount:commission,
 sourceUid:uid,
 createdAt:fb.serverTimestamp()
 });
 }
 }catch(e){
 console.warn('Referral commission failed',e);
 }
}

async function grantInvestmentIncome(){
 const fb = window.aventoraFirebase;
 if(!fb || !fb.auth.currentUser) return;
 const uid = fb.auth.currentUser.uid;
 const now = Date.now();
 const DAY_MS = 24*60*60*1000;

 try{
 const snap = await fb.getDocs(fb.query(fb.collection(fb.db,'investmentSubscriptions'), fb.where('uid','==',uid), fb.where('status','==','active')));
 for(const s of snap.docs){
 const sub = s.data();
 const duration = Number(sub.durationDays||0);
 const daysCredited = Number(sub.daysCredited||0);
 if(daysCredited >= duration) continue;
 const purchaseTime = sub.createdAt?.toDate ? sub.createdAt.toDate().getTime() : null;
 if(!purchaseTime) continue;

 // Day 1's payout unlocks exactly 24h after purchase, day 2's at 48h, etc.
 // Same clock time every day — the purchase day itself earns nothing.
 const elapsedDays = Math.floor((now - purchaseTime) / DAY_MS);
 const eligibleDays = Math.min(elapsedDays, duration);
 if(eligibleDays <= daysCredited) continue;

 const daysToCredit = eligibleDays - daysCredited;
 const income = Number(sub.dailyIncome||0);
 const totalToCredit = income * daysToCredit;
 const newDaysCredited = daysCredited + daysToCredit;

 const subRef = fb.doc(fb.db,'investmentSubscriptions', s.id);
 const userRef = fb.doc(fb.db,'users', uid);

 await fb.runTransaction(fb.db, async tx=>{
 const uSnap = await tx.get(userRef);
 const sSnap = await tx.get(subRef);
 if(!uSnap.exists() || !sSnap.exists()) return;
 const sd = sSnap.data();
 if(Number(sd.daysCredited||0) !== daysCredited) return; // already updated elsewhere, skip
 const ud = uSnap.data();

 tx.update(userRef,{
 mainBalance: Number(ud.mainBalance||0)+totalToCredit,
 totalRevenue: Number(ud.totalRevenue||0)+totalToCredit,
 updatedAt: fb.serverTimestamp()
 });
 tx.update(subRef,{
 daysCredited: newDaysCredited,
 totalCredited: Number(sd.totalCredited||0)+totalToCredit,
 lastCreditedAt: fb.serverTimestamp(),
 status: newDaysCredited >= duration ? 'completed' : 'active'
 });
 });

 await fb.addDoc(fb.collection(fb.db,'transactions'),{
 uid, type:'investment_income',
 title: daysToCredit>1 ? `Daily Package Income — ${sub.packageName||''} (${daysToCredit} days)` : `Daily Package Income — ${sub.packageName||''}`,
 amount:totalToCredit, createdAt:fb.serverTimestamp()
 });
 }
 const freshSnap = await fb.getDoc(fb.doc(fb.db,'users',uid));
 if(freshSnap.exists()) applyFirebaseUserData(freshSnap.data());
 }catch(e){ console.warn('Investment income crediting failed',e); }
}

// Wraps a button click: disables it, shows a spinner in place of its label,
// runs the async action, then restores the button — regardless of outcome.
// Prevents double-submits and gives instant visual feedback on every action.
async function withButtonLoading(btn, fn){
 if(!btn) { await fn(); return; }
 if(btn.dataset.busy === '1') return;
 btn.dataset.busy = '1';
 const original = btn.innerHTML;
 const origWidth = btn.offsetWidth;
 btn.style.minWidth = origWidth + 'px';
 btn.disabled = true;
 btn.innerHTML = '<span class="btn-spin"></span>';
 try{
 await fn();
 } finally {
 btn.disabled = false;
 btn.innerHTML = original;
 btn.style.minWidth = '';
 btn.dataset.busy = '0';
 }
}

// Waits (quietly, no error toast) for Firebase to finish loading AND for the
// auth session to resolve to a real user. Used by every action button so a
// slow/backgrounded connection just keeps the button spinning instead of
// throwing a premature "please log in" error.
async function ensureReady(maxWaitMs){
 maxWaitMs = maxWaitMs || 30000;
 const fb = await getFB(maxWaitMs);
 if(!fb) return null;
 const user = await getCurrentUser(fb, maxWaitMs);
 if(!user) return null;
 return {fb, user};
}

function getFB(timeoutMs){
 timeoutMs = timeoutMs || 25000;
 if(window.aventoraFirebase) return Promise.resolve(window.aventoraFirebase);
 return new Promise(resolve=>{
 let done=false;
 const onReady = ()=>{ if(done) return; done=true; clearTimeout(t); resolve(window.aventoraFirebase); };
 window.addEventListener('aventora-fb-ready', onReady, {once:true});
 const t = setTimeout(()=>{
 if(done) return; done=true;
 window.removeEventListener('aventora-fb-ready', onReady);
 resolve(window.aventoraFirebase || null);
 }, timeoutMs);
 });
}
function getCurrentUser(fb, timeoutMs){
 timeoutMs = timeoutMs || 10000;
 return new Promise(resolve=>{
 if(fb.auth.currentUser){ resolve(fb.auth.currentUser); return; }
 let done=false;
 const unsub = fb.onAuthStateChanged(fb.auth, user=>{
 if(done) return; done=true;
 try{ unsub(); }catch(e){}
 if(!user) console.warn('[Aventora] getCurrentUser: onAuthStateChanged fired with no user — session appears lost.');
 resolve(user);
 });
 setTimeout(()=>{
 if(done) return; done=true;
 try{ unsub(); }catch(e){}
 const fallback = fb.auth.currentUser || null;
 if(!fallback) console.warn('[Aventora] getCurrentUser: timed out after '+timeoutMs+'ms with no user — Firebase Auth never resolved a session.');
 resolve(fallback);
 }, timeoutMs);
 });
}

 t.innerHTML = `${iconCheck()}<span>${msg}</span>`;

}

 document.getElementById('session-restore-msg').textContent = 'Restoring your session...';
 document.getElementById('session-retry-btn').classList.add('hidden');
 if(isManualRetry) sessionRestoreAttempts = 0;

 try{
 const ok = await loadCurrentUser();
 if(ok){
 hideBootSplash();
 document.getElementById('auth-screen').classList.add('hidden');
 document.getElementById('app-shell').classList.remove('hidden');
 go('home');
 return;
 }
 // loadCurrentUser resolved false (e.g. banned account, or no matching
 // account doc) — it already showed its own toast; fall back to login.
 document.getElementById('session-restore-view').classList.add('hidden');
 switchAuth('login');
 hideBootSplash();
 }catch(e){
 console.error('Session restore failed', e);
 sessionRestoreAttempts++;
 if(sessionRestoreAttempts < 3){
 // Almost always a transient network/cache hiccup right after a hard
 // refresh — NOT an actual logout. Retry quietly before giving up
 // (the boot splash stays up the whole time, so this is invisible).
 setTimeout(()=>attemptSessionRestore(false), 1500);
 }else{
 hideBootSplash();
 document.getElementById('session-restore-spinner').style.display = 'none';
 document.getElementById('session-restore-msg').textContent = "Unable to connect. Check your internet and try again — You're still signed in, no password is needed.";
 document.getElementById('session-retry-btn').classList.remove('hidden');
 }
 }
}

 const note = document.getElementById('fp-note').value.trim();
 const err = document.getElementById('fp-err');
 if(!/^01[0-9]{9}$/.test(phone)){ err.textContent='Enter a valid 11-digit number'; return; }

 await withButtonLoading(btn, async ()=>{
 const fb = await getFB(30000);
 if(!fb){ err.textContent='Check your internet connection and try again'; return; }
 try{

 });

 toast("Request sent — you'll be contacted shortly");
 }catch(e){

 });

async function doLogin(btn){
 const phone = normalizePhone(document.getElementById('login-phone').value.trim());
 const pass = document.getElementById('login-pass').value.trim();
 const err = document.getElementById('login-err');

 if(!phone || !pass){ err.textContent = 'Enter your mobile number and password'; return; }
 err.textContent='';

 await withButtonLoading(btn, async ()=>{
 const fb = await getFB(30000);
 if(!fb){ err.textContent='Check your internet connection and try again'; return; }

 try{
 await fb.signInWithEmailAndPassword(fb.auth, phoneAuthEmail(phone), pass);
 if(!await loadCurrentUser()){
 await fb.signOut(fb.auth);
 return;
 }
 document.getElementById('auth-screen').classList.add('hidden');
 document.getElementById('app-shell').classList.remove('hidden');
 go('home');
 toast('Logged in successfully');
 }catch(e){
 console.error(e);
 err.textContent = e.code==='auth/invalid-credential'
 ? 'Mobile number or password is incorrect'
 : (e.code==='auth/user-not-found' ? 'No account exists with this number' : 'Could not log in');
 }
 });
}

async function doRegister(btn){
 const name=document.getElementById('reg-name').value.trim();
 const phone=normalizePhone(document.getElementById('reg-phone').value.trim());
 const referral=(document.getElementById('reg-referral').value.trim() || getReferralFromUrl()).toUpperCase();
 const pass=document.getElementById('reg-pass').value;
 const pass2=document.getElementById('reg-pass2').value;

 if(!name || !phone || !pass || !pass2){
 toast('Fill in all the information'); return;
 }

 // Bangladesh mobile validation for this phone-as-login system.
 if(!/^01[3-9]\d{8}$/.test(phone)){
 toast('Enter a valid 11-digit mobile number'); return;
 }

 if(pass.length < 6){
 toast('Use a password of at least 6 characters'); return;
 }

 if(pass !== pass2){
 toast("The two passwords don't match"); return;
 }

 const fb = await getFB(30000);
 if(!fb){ toast('Check your internet connection and try again'); return; }

 await withButtonLoading(btn, async ()=>{
 const authEmail=phoneAuthEmail(phone);
 let createdUser=null;

 try{
 // Firebase Authentication account.
 const cred=await fb.createUserWithEmailAndPassword(
 fb.auth,
 authEmail,
 pass
 );
 createdUser=cred.user;

 // Firestore profile. If this fails, roll back the Auth account so the
 // next attempt does not get stuck with "email-already-in-use".
 await createFirestoreUser(createdUser.uid,name,phone,referral);

 state.user={
 ...state.user,
 name,
 phone,
 userId:'PB-'+createdUser.uid.slice(0,6).toUpperCase(),
 referralId:'',
 status:'inactive',
 totalRevenue:0,
 mainBalance:0,
 salaryBalance:0,
 referralBalance:0,
 depositBalance:0,
 avatarInitial:name[0]
 };

 await fb.signOut(fb.auth);

 toast('Account created — Log in now');
 document.getElementById('login-phone').value=phone;
 document.getElementById('login-pass').value='';
 switchAuth('login');

 }catch(e){
 console.error('Aventora registration error:', e);

 // Roll back a newly-created Auth user when Firestore setup fails.
 if(createdUser){
 try{
 if(fb.auth.currentUser && fb.auth.currentUser.uid===createdUser.uid){
 await fb.deleteUser(createdUser);
 }
 }catch(rollbackError){
 console.error('Auth rollback failed:', rollbackError);
 }
 }

 const code=e?.code || '';

 const messages={
 'auth/email-already-in-use':'An account already exists with this mobile number',
 'auth/invalid-email':'Could not create a login ID for this mobile number',
 'auth/weak-password':'Please use a stronger password (at least 6 characters)',
 'auth/operation-not-allowed':'Firebase Console- Email/Password Sign-in not enabled',
 'auth/network-request-failed':'internet/Firebase Network connection issue',
 'auth/api-key-not-valid.-please-pass-a-valid-api-key.':'Firebase API Key Invalid. Firebase Console-current Web App config from apiKey Make sure it matches',
 'auth/api-key-not-valid':'Firebase API Key Invalid. Firebase Console-current Web App config from apiKey Make sure it matches',
 'auth/too-many-requests':'Too many attempts. Please try again in a little while',
 'permission-denied':'Firestore Rules is blocking registration',
 'failed-precondition':'Firestore Database/Rules configuration Test',
 'unavailable':'Firestore Temporarily unavailable'
 };

 toast(messages[code] || `Registration failed: ${code || 'Unknown Firebase error'}`);

 // Keep the exact technical error visible in the browser console.
 console.error('Firebase error code:', code);
 console.error('Firebase error message:', e?.message || e);
 }
 });
}

}

async function submitRedeem(btn){
 const codeRaw = document.getElementById('redeem-code').value.trim();
 const err = document.getElementById('redeem-err');
 if(!codeRaw){ err.textContent = 'Enter a code'; return; }

 await withButtonLoading(btn, async ()=>{
 const ctx = await ensureReady();
 if(!ctx){ err.textContent = 'Check your internet connection and try again'; return; }
 const {fb, user} = ctx;
 const code = codeRaw.toUpperCase();
 const uid = user.uid;
 err.textContent = '';

 try{
 const dupSnap = await fb.getDocs(fb.query(
 fb.collection(fb.db,'redemptions'), fb.where('uid','==',uid), fb.where('code','==',code), fb.limit(1)
 ));
 if(!dupSnap.empty){ err.textContent = 'You have already used this code'; return; }

 const codeRef = fb.doc(fb.db,'redeemCodes',code);
 let amount = 0;
 await fb.runTransaction(fb.db, async tx=>{
 const snap = await tx.get(codeRef);
 if(!snap.exists()) throw new Error('invalid');
 const d = snap.data();
 if(d.active===false) throw new Error('inactive');
 if(d.expiresAt?.toDate && d.expiresAt.toDate() < new Date()) throw new Error('expired');
 if(typeof d.maxUses==='number' && Number(d.usedCount||0) >= d.maxUses) throw new Error('limit');
 amount = Number(d.amount||0);
 const userRef = fb.doc(fb.db,'users',uid);
 const uSnap = await tx.get(userRef);
 const u = uSnap.data();

 tx.update(codeRef,{usedCount:Number(d.usedCount||0)+1});
 tx.update(userRef,{
 mainBalance:Number(u.mainBalance||0)+amount,
 totalRevenue:Number(u.totalRevenue||0)+amount,
 updatedAt:fb.serverTimestamp()
 });
 });
 await fb.addDoc(fb.collection(fb.db,'redemptions'),{uid, code, amount, createdAt:fb.serverTimestamp()});
 await fb.addDoc(fb.collection(fb.db,'transactions'),{uid, type:'redeem', title:'Redeem Code', amount, createdAt:fb.serverTimestamp()});
 state.user.mainBalance = Number(state.user.mainBalance||0)+amount;
 state.user.totalRevenue = Number(state.user.totalRevenue||0)+amount;
 document.getElementById('redeem-code').value='';
 toast(`Code claimed successfully, ৳${fmt(amount)} Added`);
 go('redeem');
 }catch(e){
 const map = {invalid:'The code is invalid', inactive:'This code is disabled', expired:'The code has expired', limit:"The code's usage limit has been reached"};
 err.textContent = map[e.message] || 'Could not use the code';
 }
 });
}

async function submitWithdraw(btn){
 const amt = Number(document.getElementById('withdraw-amt').value);
 const minWd = Number(firebaseSettings.minWithdraw || 100);
 const maxWd = Number(firebaseSettings.maxWithdraw || 20000);
 if((firebaseSettings.withdrawPolicy||'all')==='subscribers_only' && !state.user.hasPurchasedPackage && !state.mySubscriptions.length){
 toast('You must buy any one subscription package before you can withdraw');
 return;
 }
 if(!amt || amt < minWd){ toast(`Minimum ৳${fmt(minWd)} can withdraw`); return; }
 if(amt > maxWd){ toast(`Maximum ৳${fmt(maxWd)} can withdraw`); return; }
 if(!state.user.bkashNumber && !state.user.nagadNumber){ toast('Add a wallet first'); return; }

 await withButtonLoading(btn, async ()=>{
 const ctx = await ensureReady();
 if(!ctx){ toast('Check your internet connection and try again'); return; }
 const {fb, user} = ctx;

 const uid = user.uid;
 let walletType, walletNumber;
 if(state.user.bkashNumber && state.user.nagadNumber){
 const choice = document.getElementById('withdraw-wallet-choice').value;
 walletType = choice==='bkash' ? 'bKash' : 'Nagad';
 walletNumber = choice==='bkash' ? state.user.bkashNumber : state.user.nagadNumber;
 }else if(state.user.bkashNumber){
 walletType = 'bKash'; walletNumber = state.user.bkashNumber;
 }else{
 walletType = 'Nagad'; walletNumber = state.user.nagadNumber;
 }
 const fee = Math.round(amt*(Number(firebaseSettings.withdrawFeePercent ?? 2)/100));
 const net = amt-fee;
 const userRef = fb.doc(fb.db,'users',uid);

 try{
 await fb.runTransaction(fb.db, async tx=>{
 const snap = await tx.get(userRef);
 if(!snap.exists()) throw new Error('no-user');
 const bal = Number(snap.data().mainBalance||0);
 if(bal < amt) throw new Error('insufficient');
 tx.update(userRef,{mainBalance: bal-amt, updatedAt: fb.serverTimestamp()});
 });
 }catch(e){
 toast(e.message==='insufficient' ? 'Not enough balance' : 'The request failed');
 return;
 }

 try{
 await fb.addDoc(fb.collection(fb.db,'withdrawalRequests'),{
 uid, amount:amt, fee, netAmount:net,
 walletType, walletNumber,
 status:'pending', createdAt:fb.serverTimestamp()
 });
 state.user.mainBalance = Number(state.user.mainBalance||0)-amt;
 toast('Withdrawal request sent');
 await loadUserCollections();
 go('withdraw');
 }catch(e){
 console.error(e);
 toast('Failed to save the request, please contact support');
 }
 });
}

let currentTaskProofImage = null;
function compressImageFile(file, maxWidth, quality){
 return new Promise((resolve, reject)=>{
 const reader = new FileReader();
 reader.onload = e=>{
 const img = new Image();
 img.onload = ()=>{
 let w = img.width, h = img.height;
 if(w > maxWidth){ h = Math.round(h * maxWidth/w); w = maxWidth; }
 const canvas = document.createElement('canvas');
 canvas.width = w; canvas.height = h;
 canvas.getContext('2d').drawImage(img, 0, 0, w, h);
 resolve(canvas.toDataURL('image/jpeg', quality));
 };
 img.onerror = ()=>reject(new Error('image-decode-failed'));
 img.src = e.target.result;
 };
 reader.onerror = ()=>reject(new Error('file-read-failed'));
 reader.readAsDataURL(file);
 });
}
async function compressImageForUpload(file){
 let quality = 0.7, maxWidth = 900;
 let dataUrl = await compressImageFile(file, maxWidth, quality);
 while(dataUrl.length > 700000 && quality > 0.3){
 quality -= 0.15;
 dataUrl = await compressImageFile(file, maxWidth, quality);
 }
 if(dataUrl.length > 700000){
 dataUrl = await compressImageFile(file, 600, 0.5);
 }
 return dataUrl;
}

 const {fb, user} = ctx;

 try{
 const dupSnap = await fb.getDocs(fb.query(
 fb.collection(fb.db,'taskSubmissions'), fb.where('uid','==',user.uid), fb.where('taskId','==',taskId), fb.limit(1)
 ));
 if(!dupSnap.empty && dupSnap.docs[0].data().status!=='rejected'){
 err.textContent='This task has already been submitted'; return;
 }

 await fb.addDoc(fb.collection(fb.db,'taskSubmissions'),{
 uid:user.uid, taskId, taskTitle:t.title, reward:Number(t.reward||0),
 proof, proofImage:currentTaskProofImage, status:'pending', createdAt:fb.serverTimestamp()
 });
 currentTaskProofImage = null;
 toast('Task submitted — the admin is reviewing it');
 closeModal();
 await loadUserCollections();
 go('task');
 }catch(e){
 console.error(e);
 err.textContent = e?.code==='resource-exhausted' || /longer than/i.test(e?.message||'')
 ? 'Image is too large — try again with a smaller/lighter image'
 : 'Could not submit, please try again';
 }
 });
}

/* ---- Modals (add wallet / edit profile / change password) ---- */
function openModal(html){
 document.getElementById('modal-root').insertAdjacentHTML('beforeend', html);
}
function closeModal(){
 const ov = document.querySelector('.modal-overlay');
 if(ov) ov.remove();
}

let depositFlow = {method:'bKash', amount:0};
function depositNumberFor(method){
 return method==='bKash' ? String(firebaseSettings.bkashDepositNumber||'') : String(firebaseSettings.nagadDepositNumber||'');
}

async function openDeposit(){
 depositFlow = {method: selectedDepositMethod || 'bKash', amount:0};
 openModal(`
 <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
 <div class="sheet" id="deposit-modal-body"></div>
 </div>`);
 renderDepositStep1();
}

function renderDepositStep1(){
 document.getElementById('deposit-modal-body').innerHTML = `
 <div class="sheet-handle"></div>
 <h3>Deposit</h3>
 <p class="desc">Choose a payment method and enter the amount you want to deposit.</p>

 <div class="field">
 <label>Payment Method</label>
 <div style="display:flex; gap:10px; margin-top:6px;">
 <div onclick="selectDepositMethod('bKash')" style="flex:1; border:1.5px solid ${depositFlow.method==='bKash'?'var(--primary)':'var(--border)'}; border-radius:14px; padding:14px; text-align:center; cursor:pointer; background:${depositFlow.method==='bKash'?'var(--accent-soft)':'var(--card)'};">
 <b style="font-size:14px;">bKash</b>
 </div>
 <div onclick="selectDepositMethod('Nagad')" style="flex:1; border:1.5px solid ${depositFlow.method==='Nagad'?'var(--primary)':'var(--border)'}; border-radius:14px; padding:14px; text-align:center; cursor:pointer; background:${depositFlow.method==='Nagad'?'var(--accent-soft)':'var(--card)'};">
 <b style="font-size:14px;">Nagad</b>
 </div>
 </div>
 </div>

 <div class="field">
 <label>Deposit Amount</label>
 <div class="field-input"><span style="color:var(--text-mute);font-weight:700">৳</span><input id="deposit-amount" type="number" min="1" placeholder="e.g. 500" value="${depositFlow.amount||''}"></div>
 <div style="font-size:11px; color:var(--text-mute); margin-top:6px">Limit: ৳${fmt(Number(firebaseSettings.minDeposit||50))} – ৳${fmt(Number(firebaseSettings.maxDeposit||50000))}</div>
 </div>

 <div class="err-msg" id="deposit-err"></div>
 <button class="btn btn-primary btn-block" onclick="goDepositStep2()">Next</button>
 `;
}

function selectDepositMethod(m){
 depositFlow.method = m;
 renderDepositStep1();
}

function goDepositStep2(){
 const amount = Number(document.getElementById('deposit-amount')?.value || 0);
 const err = document.getElementById('deposit-err');
 const minDep = Number(firebaseSettings.minDeposit || 50);
 const maxDep = Number(firebaseSettings.maxDeposit || 50000);
 if(!amount || amount < 1){ err.textContent='Enter the deposit amount'; return; }
 if(amount < minDep){ err.textContent=`Minimum deposit is ৳${fmt(minDep)}`; return; }
 if(amount > maxDep){ err.textContent=`Maximum deposit is ৳${fmt(maxDep)}`; return; }
 depositFlow.amount = amount;
 selectedDepositMethod = depositFlow.method;
 renderDepositStep2();
}

function renderDepositStep2(){
 const number = depositNumberFor(depositFlow.method);
 document.getElementById('deposit-modal-body').innerHTML = `
 <div class="sheet-handle"></div>
 <div style="display:flex; align-items:center; gap:8px; margin-bottom:2px;">
 <button class="back-btn" onclick="renderDepositStep1()" style="width:30px;height:30px;flex-shrink:0;">${icon('<path d="M15 18l-6-6 6-6"/>',16)}</button>
 <h3 style="margin:0;">Send Money</h3>
 </div>
 <p class="desc">Send ৳${fmt(depositFlow.amount)} to the ${depositFlow.method} number below.</p>

 <div class="card" style="padding:13px;margin-bottom:12px;">
 <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;">
 <div>
 <b style="display:block;font-size:14px;">${depositFlow.method}</b>
 <span style="font-size:12px;color:var(--text-mute);">Personal Number — Send Money</span>
 </div>
 <b style="font-size:15px;">${number}</b>
 </div>
 <button class="btn btn-outline btn-block btn-sm" onclick="copyDepositNumber('${number}')">Copy number</button>
 </div>

 <div class="card" style="padding:11px 13px; margin-bottom:14px; background:var(--warn-soft, rgba(240,185,78,.1)); border:1px solid rgba(240,185,78,.3);">
 <b style="display:block; font-size:12.5px; color:var(--warning); margin-bottom:3px;">⚠️ Make sure to Send Money to this number first</b>
 <span style="font-size:11.5px; color:var(--text-mute);">Use the "Send Money" option only — "Payment" or "Cash Out" will incur extra charges and the deposit cannot be verified. After sending, enter the Transaction ID below.</span>
 </div>

 <div class="field">
 <label>Transaction ID</label>
 <div class="field-input"><input id="deposit-txid" type="text" maxlength="80" placeholder="Enter Transaction ID"></div>
 </div>

 <div class="field">
 <label>Sender's Number</label>
 <div class="field-input"><input id="deposit-sender" type="tel" maxlength="20" placeholder="01XXXXXXXXX"></div>
 </div>

 <div class="err-msg" id="deposit-err"></div>
 <button class="btn btn-primary btn-block" onclick="submitDeposit(this)">Submit</button>
 <p class="plan-note">Only enter the Transaction ID of a genuine transaction. The money won't be added to the balance until verified.</p>
 `;
}

function copyDepositNumber(num){
 navigator.clipboard?.writeText(num).then(()=>toast('Payment number copied')).catch(()=>toast(num));
}

async function submitDeposit(btn){
 const txid = document.getElementById('deposit-txid')?.value.trim();
 const sender = document.getElementById('deposit-sender')?.value.trim();
 const err = document.getElementById('deposit-err');
 const method = depositFlow.method;
 const amount = depositFlow.amount;

 if(!txid){ err.textContent='Enter the Transaction ID'; return; }
 if(!sender){ err.textContent="Enter the number you sent the money from"; return; }

 err.textContent='';
 await withButtonLoading(btn, async ()=>{
 const ctx = await ensureReady();
 if(!ctx){ err.textContent='Check your internet connection and try again'; return; }
 const {fb, user} = ctx;
 try{
 const uid = user.uid;
 await fb.addDoc(fb.collection(fb.db,'depositRequests'),{
 uid,
 method,
 receiverNumber: depositNumberFor(method),
 amount,
 transactionId:txid,
 senderNumber:sender,
 status:'pending',
 createdAt:fb.serverTimestamp()
 });
 closeModal();
 toast('Deposit request submitted. The balance will be added after verification');
 }catch(e){
 console.error(e);
 err.textContent='Could not submit the request. Please try again';
 }
 });
}

async function updateStatus(newStatus){
 state.user.status = newStatus;
 await persistStatus();
}


function openEditProfile(){
 openModal(`
 <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
 <div class="sheet">
 <div class="sheet-handle"></div>
 <h3>Edit profile</h3>
 <div class="field"><label>Full Name</label><div class="field-input">${iconUser()}<input id="edit-name" value="${state.user.name}"></div></div>
 <div class="field"><label>Mobile Number</label><div class="field-input"><input value="${state.user.phone}" disabled style="color:var(--text-mute)"></div></div>
 <button class="btn btn-primary btn-block" onclick="saveProfile()">Save</button>
 </div>
 </div>`);
}
async function saveProfile(){
 const name = document.getElementById('edit-name').value.trim();
 if(!name){ toast('Enter a name'); return; }
 try{
 state.user.name = name;
 state.user.avatarInitial = name[0];
 await saveUserPatch({name});
 closeModal();
 go('profile');
 toast('Profile updated');
 }catch(e){
 console.error(e);
 toast('Could not update the profile');
 }
}
function openChangePass(){
 openModal(`
 <div class="modal-overlay" onclick="if(event.target===this) closeModal()">
 <div class="sheet">
 <div class="sheet-handle"></div>
 <h3>Change password</h3>
 <div class="field"><label>Current Password</label><div class="field-input">${iconLock()}<input type="password" placeholder="••••••••"></div></div>
 <div class="field"><label>New Password</label><div class="field-input">${iconLock()}<input type="password" placeholder="••••••••"></div></div>
 <button class="btn btn-primary btn-block" onclick="closeModal(); toast('Password changed')">Confirm</button>
 </div>
 </div>`);
}

/* Init: start on login (hidden behind the boot splash until we know the
 real auth state, so a returning logged-in user never sees a flash of
 the login form before the app shell appears). */
switchAuth('login');

function hideBootSplash(){
 const el = document.getElementById('boot-splash');
 if(el) el.classList.add('hidden');
}
// Safety net: never leave someone stuck behind the splash forever if
// Firebase fails to initialize (e.g. network totally blocked).
setTimeout(()=>{
 const el = document.getElementById('boot-splash');
 if(el && !el.classList.contains('hidden')){
 hideBootSplash();
 switchAuth('login');
 }
}, 8000);

(async function initFirebaseSession(){
 if(!window.aventoraFirebase){
 await new Promise(resolve => window.addEventListener('aventora-fb-ready', resolve, {once:true}));
 }
 const fb=window.aventoraFirebase;
 if(!fb){ hideBootSplash(); return; }

 try{
 await loadFirebaseSettings();

 fb.onAuthStateChanged(fb.auth, async user=>{
 if(!user){ hideBootSplash(); return; }
 attemptSessionRestore(false);
 });
 }catch(e){
 console.error('Firebase init failed',e);
 hideBootSplash();
 }

 const ref=getReferralFromUrl();
 const refInput=document.getElementById('reg-referral');
 if(ref && refInput) refInput.value=ref;
})();
</script>
